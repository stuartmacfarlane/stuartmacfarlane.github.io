<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0b1f33"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd966"/>
      <stop offset="100%" stop-color="#f4a300"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2d9cdb"/>
      <stop offset="100%" stop-color="#56ccf2"/>
    </linearGradient>
  </defs>

  <!-- background circle -->
  <circle cx="320" cy="320" r="300" fill="url(#sky)"/>
  <circle cx="320" cy="320" r="300" fill="none" stroke="#56ccf2" stroke-width="6" opacity="0.4"/>

  <!-- sun -->
  <circle cx="230" cy="220" r="70" fill="url(#sun)"/>

  <!-- cloud -->
  <g fill="#eef6fb" opacity="0.95">
    <ellipse cx="380" cy="260" rx="90" ry="46"/>
    <ellipse cx="330" cy="240" rx="60" ry="40"/>
    <ellipse cx="440" cy="250" rx="55" ry="38"/>
  </g>

  <!-- anemometer mast -->
  <g stroke="#f2f2f2" stroke-width="8" stroke-linecap="round">
    <line x1="320" y1="330" x2="320" y2="470"/>
    <line x1="320" y1="330" x2="270" y2="300"/>
    <line x1="320" y1="330" x2="370" y2="300"/>
    <line x1="320" y1="330" x2="320" y2="270"/>
  </g>
  <circle cx="320" cy="330" r="10" fill="#f2f2f2"/>
  <circle cx="270" cy="300" r="9" fill="#f2f2f2"/>
  <circle cx="370" cy="300" r="9" fill="#f2f2f2"/>
  <circle cx="320" cy="270" r="9" fill="#f2f2f2"/>

  <!-- base -->
  <path d="M290 470 L350 470 L365 500 L275 500 Z" fill="#cfd8dc"/>

  <!-- wave / gosport waterfront motif -->
  <path d="M60 500 Q160 470 260 500 T460 500 T580 495" stroke="url(#wave)" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- text -->
  <text x="320" y="560" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="1">GOSPORT</text>
  <text x="320" y="600" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" fill="#9fd3ea" letter-spacing="4">WEATHER STATION</text>
</svg>
