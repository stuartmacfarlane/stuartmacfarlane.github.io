<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rotating Cube</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #222;
            perspective: 1000px;
        }

        .cube {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate 5s infinite linear;
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .face:nth-child(1) { background: rgba(255, 0, 0, 0.8); } /* Front */
        .face:nth-child(2) { background: rgba(0, 255, 0, 0.8); } /* Right */
        .face:nth-child(3) { background: rgba(0, 0, 255, 0.8); } /* Back */
        .face:nth-child(4) { background: rgba(255, 255, 0, 0.8); } /* Left */
        .face:nth-child(5) { background: rgba(255, 0, 255, 0.8); } /* Top */
        .face:nth-child(6) { background: rgba(0, 255, 255, 0.8); } /* Bottom */

        .face:nth-child(1) { transform: translateZ(100px); }
        .face:nth-child(2) { transform: rotateY(90deg) translateZ(100px); }
        .face:nth-child(3) { transform: rotateY(180deg) translateZ(100px); }
        .face:nth-child(4) { transform: rotateY(270deg) translateZ(100px); }
        .face:nth-child(5) { transform: rotateX(90deg) translateZ(100px); }
        .face:nth-child(6) { transform: rotateX(-90deg) translateZ(100px); }

        @keyframes rotate {
            from { transform: rotateX(0) rotateY(0) translateZ(0); }
            to { transform: rotateX(360deg) rotateY(360deg) translateZ(0); }
        }
    </style>
</head>
<body>
    <div class="cube">
        <div class="face"></div>
        <div class="face"></div>
        <div class="face"></div>
        <div class="face"></div>
        <div class="face"></div>
        <div class="face"></div>
    </div>
<div id="timer" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; font-size: 24px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;"></div>

<script>
    let startTime = Date.now();
    function updateTimer() {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById('timer').textContent = `You've been watching for ${elapsed} seconds!`;
    }
    setInterval(updateTimer, 1000);
    updateTimer(); // Initial call
</script>
</body>
</html>
