<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Matrix</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: black;
        overflow: hidden;
        font-family: monospace;
    }

    #matrix {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
    }

    .content {
        position: relative;
        z-index: 1;
        color: #00ff41;
        text-align: center;
        padding-top: 40vh;
        text-shadow: 0 0 10px #00ff41;
    }

    h1 {
        font-size: 40px;
    }

    p {
        font-size: 20px;
    }

    #lockStatus {
        margin-top: 24px;
        font-size: 16px;
    }

    #elapsed {
        display: block;
        margin-top: 8px;
        font-size: 24px;
        font-variant-numeric: tabular-nums;
    }
</style>
</head>

<canvas id="matrix"></canvas>

<div class="content">
    <h1>SCREEN ACTIVE</h1>
    <p>Onboarding in process</p>
    <div id="lockStatus">WAKE LOCK: REQUESTING</div>
    <span id="elapsed">00:00:00</span>

</div>
   
<script>

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

const fontSize = 16;

let width;
let height;
let columns;
let drops;

const characters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789" +
    "アァカサタナハマヤャラワガザダバパ" +
    "アイウエオカキクケコサシスセソ";

function resizeCanvas() {

    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    columns = Math.floor(width / fontSize);

    drops = [];

    for (let i = 0; i < columns; i++) {
        drops[i] = Math.random() * -100;
    }
}

function drawMatrix() {

    // Black transparent layer creates the fading trail
    ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
    ctx.fillRect(0, 0, width, height);

    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {

        const character =
            characters.charAt(
                Math.floor(Math.random() * characters.length)
            );

        const x = i * fontSize;
        const y = drops[i] * fontSize;

        ctx.fillStyle = "#00ff41";

        ctx.fillText(character, x, y);

        drops[i]++;

        if (y > height && Math.random() > 0.975) {
            drops[i] = 0;
        }
    }
}

// Screen Wake Lock + active timer
let wakeLock = null;
let lockStartedAt = null;
const lockStatus = document.getElementById("lockStatus");
const elapsed = document.getElementById("elapsed");

function updateElapsed() {
    if (!lockStartedAt) {
        elapsed.textContent = "00:00:00";
        return;
    }

    const totalSeconds = Math.floor((Date.now() - lockStartedAt) / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    elapsed.textContent =
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");
}

async function requestWakeLock() {
    if (!("wakeLock" in navigator)) {
        lockStatus.textContent = "WAKE LOCK: UNSUPPORTED";
        return;
    }

    try {
        wakeLock = await navigator.wakeLock.request("screen");
        if (!lockStartedAt) lockStartedAt = Date.now();
        lockStatus.textContent = "WAKE LOCK: ACTIVE";

        wakeLock.addEventListener("release", () => {
            wakeLock = null;
            lockStatus.textContent = "WAKE LOCK: RELEASED";
        });
    } catch (err) {
        wakeLock = null;
        lockStatus.textContent = "WAKE LOCK: FAILED";
        console.error("Wake Lock request failed:", err);
    }
}

document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" && wakeLock === null) {
        await requestWakeLock();
    }
});

setInterval(updateElapsed, 1000);
requestWakeLock();
updateElapsed();

resizeCanvas();

window.addEventListener("resize", resizeCanvas);

setInterval(drawMatrix, 35);

</script>

</body>
</html>
